<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>
:root{color-scheme:light dark;--surface:hsl(0,0%,100%);--bg:hsl(150,12%,97%);--text:hsl(150,12%,15%);--muted:hsl(150,8%,35%);--line:hsl(150,10%,85%);--control:hsl(150,8%,48%);--accent:hsl(150,40%,25%);--tint:hsl(150,25%,94%)}
*{box-sizing:border-box}body{font:14px/1.6 system-ui,sans-serif;color:var(--text);margin:0;padding:16px;background:var(--surface)}h2{font-size:20px;margin:0 0 8px}h3{font-size:16px;margin:0;font-weight:600}p{margin:8px 0 16px}.source,.muted{color:var(--muted)}section{margin:24px 0}details{border-top:1px solid var(--line);padding:12px 0}summary{font-weight:600;cursor:pointer}details[open]>summary{margin-bottom:12px}table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}th,td{padding:8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);padding:12px;border-radius:4px}.controls,.search,.exports,.result-heading{display:flex;flex-wrap:wrap;align-items:end;gap:12px}.controls{margin:16px 0}.search{margin:16px 0 24px}label{display:flex;flex-direction:column;gap:4px;color:var(--muted)}input,select{font:inherit;color:var(--text);background:var(--surface);padding:8px;border:1px solid var(--control);border-radius:4px}input{width:128px}select{max-width:100%}button{font:inherit;padding:8px 16px;border:1px solid var(--control);border-radius:4px;background:var(--surface);color:var(--text);cursor:pointer}button.primary{background:var(--accent);color:hsl(0,0%,100%);border-color:var(--accent)}button:disabled{opacity:.5;cursor:wait}:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.result-heading{align-items:baseline;justify-content:space-between}.badge{font-size:12px;font-weight:600;color:var(--accent)}#computed{background:var(--tint);border-left:4px solid var(--accent);padding:16px;margin:16px 0}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:16px 0}.metrics span{display:block;color:var(--muted);font-size:12px}.metrics strong{display:block;font-size:20px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}.equation{font-weight:600}.note{color:hsl(35,80%,25%);background:hsl(40,90%,94%);padding:12px}.scroll{overflow-x:auto}.exports{margin-top:16px}#status{min-height:24px}.footer{color:var(--muted);margin:24px 0 0}@media(max-width:640px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}input{width:96px}.controls{gap:8px}}@media(prefers-color-scheme:dark){:root{--surface:hsl(150,8%,12%);--bg:hsl(150,8%,17%);--text:hsl(150,10%,94%);--muted:hsl(150,8%,72%);--line:hsl(150,8%,30%);--control:hsl(150,8%,58%);--accent:hsl(150,45%,68%);--tint:hsl(150,15%,17%)}button.primary{background:hsl(150,40%,25%);border-color:var(--control)}.note{color:hsl(40,80%,80%);background:hsl(35,35%,18%)}}
