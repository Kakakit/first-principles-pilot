<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{--text:hsl(150,15%,17%);--muted:hsl(150,8%,36%);--line:hsl(150,10%,85%);--surface:hsl(0,0%,100%);--control:hsl(150,8%,45%);--tint:hsl(150,20%,95%);--accent:hsl(150,45%,26%);color-scheme:light dark}*{box-sizing:border-box}body{font:14px/1.6 system-ui,sans-serif;color:var(--text);background:var(--surface);margin:0;padding:16px;overflow-wrap:anywhere}h1{font-size:20px;margin:0 0 8px}h2{font-size:16px;margin:0 0 12px}.muted{color:var(--muted)}section{margin:24px 0}.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:end}label{display:flex;flex-direction:column;gap:4px}select,input,button{font:inherit;padding:8px;border:1px solid var(--control);border-radius:4px;background:var(--surface);color:var(--text);max-width:100%}button{cursor:pointer}button:disabled{opacity:.5}:focus-visible{outline:2px solid var(--accent);outline-offset:2px}#summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:16px;padding:16px;background:var(--tint);border-left:4px solid var(--accent)}#summary span{display:block;color:var(--muted);font-size:12px}#summary strong{display:block;font-size:20px}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap;font-variant-numeric:tabular-nums}th,td{padding:8px;text-align:right;border-bottom:1px solid var(--line)}th:first-child,td:first-child{text-align:left}details{border-top:1px solid var(--line);padding:12px 0}summary{cursor:pointer;font-weight:600}details[open]>summary{margin-bottom:12px}pre{white-space:pre-wrap;max-height:420px;overflow:auto;background:var(--tint);padding:12px}svg{width:100%;min-width:620px;height:auto}#error{color:hsl(0,65%,40%)}#status{min-height:24px}@media(prefers-color-scheme:dark){:root{--text:hsl(150,10%,94%);--muted:hsl(150,8%,72%);--line:hsl(150,8%,30%);--surface:hsl(150,8%,12%);--control:hsl(150,8%,58%);--tint:hsl(150,15%,17%);--accent:hsl(150,45%,68%)}}
</style></head><body><h1>局域 d 轨道占据</h1><p class="muted">读取 VASP 最终完整电子步；占据单位为电子，不是晶场能级。局域坐标依据所选多面体自动拟合。</p><p id="error" role="alert"></p><div class="controls"><label>计算结果<select id="model"></select></label><label>原子 / 多面体<select id="atom"></select></label><label>自旋<select id="spin"></select></label><label>轨道坐标<select id="frame"></select></label><label>显示内容<select id="kind"><option value="diagonal">指定轨道占据</option><option value="natural">自然占据轨道</option></select></label></div><p id="identity"></p><section id="summary"></section><section><h2>占据分布</h2><div class="scroll"><svg id="plot" viewBox="0 0 900 350" role="img" aria-label="局域轨道占据柱状图"></svg></div><div id="numbers"></div></section><details><summary>自然轨道的混合组成</summary><div id="weights"></div><p class="muted">自然轨道按占据数降序，近简并时单条本征矢不唯一，不自动等同纯 d 轨道。</p></details><details><summary>配位环境与局域轴</summary><div id="geometry"></div></details><details><summary>完整占据矩阵</summary><div id="matrix"></div></details><details><summary>来源原文与解释边界</summary><div id="warnings"></div><pre id="evidence"></pre></details><section class="controls"><button id="save">保存展示选择</button><button id="csv">导出占据 CSV</button><button id="json">导出完整 JSON</button><button id="png">导出图片 PNG</button></section><p id="status" role="status"></p><script>/* OCCUPATION MODEL */
/* OCCUPATION MAIN */</script></body></html>
