<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TB2J 元素对与轨道贡献</title><style>
:root{font:14px system-ui,-apple-system,sans-serif;color:#18313d;background:#fbfcfd;color-scheme:light}*{box-sizing:border-box}body{margin:0;padding:16px}h2,h3{margin:8px 0 14px}p{line-height:1.6}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #bed0d9;background:#fff;border-radius:7px;padding:7px 12px;color:inherit}button:hover{background:#eaf3f7}button:disabled{opacity:.55;cursor:default}input[type=number],input[type=text],select{width:100%;border:1px solid #bed0d9;border-radius:6px;background:white;padding:7px;color:inherit}input[type=checkbox]{accent-color:#157a8b}label{display:flex;gap:6px;align-items:center}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.fields>label{display:block}.fields input,.fields select{margin-top:5px}.checks,.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.checks label{padding:7px 10px;border:1px solid #d1e0e5;border-radius:7px}.note{color:#506873}.warning{color:#85621a;background:#fff8e4;padding:10px;border-radius:6px}.error{color:#a32232;background:#ffeff1;padding:10px;border-radius:6px}#chart{height:430px;width:100%;margin:12px 0}.scroll{overflow:auto;max-height:480px;border:1px solid #d8e3e8;border-radius:7px}table{border-collapse:collapse;width:100%;white-space:nowrap}th,td{padding:9px 11px;border-bottom:1px solid #e0e8eb;text-align:left}th{background:#edf4f7;position:sticky;top:0;z-index:1}th button{padding:2px;border:0;background:transparent;font-weight:600}tr.selected{background:#e3f6fa}td input{min-width:95px}details{border:1px solid #d4e0e6;border-radius:7px;padding:10px;margin:14px 0}summary{cursor:pointer;font-weight:600}pre{white-space:pre-wrap;max-height:240px;overflow:auto;background:#f1f5f7;padding:10px;border-radius:5px}.orbital-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.orbital-fields fieldset{border:1px solid #d5e2e7;border-radius:6px}.orbital-fields label{display:inline-flex;padding:6px}.pager{display:flex;gap:10px;align-items:center;justify-content:flex-end;margin:10px 0}.status{min-height:22px}@media(max-width:600px){body{padding:9px}#chart{height:330px}.fields{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body><h2>TB2J · 元素对交换参数</h2><p id="summary" role="status">正在载入完整绘图数据…</p><div id="pairs" class="checks" aria-label="元素对选择"></div><div class="fields" id="filters"></div><div id="orbital-controls" hidden></div><div id="chart" role="img" aria-label="元素对 Jij 随距离图"></div><p id="chart-note" class="note"></p><div class="actions"><button id="png">保存当前图 PNG</button><button id="csv">下载筛选表格 CSV</button><button id="mapping-download">下载轨道标签映射</button></div><p id="message" class="status note" role="status"></p><p id="error" class="error" role="alert" hidden></p><div class="pager"><span id="rows-count"></span><button id="prev">上一页</button><span id="page-label"></span><button id="next">下一页</button></div><div id="table" class="scroll"></div><details><summary>轨道名称与分组映射</summary><p>显示原子内 TB2J 矩阵序号及对应的全局 Wannier 序号。候选名称来自冻结投影定义，只作标签建议；需核对实际基底顺序、轨道混合和投影方向。标签不会证明轨道纯度，不自动归为 t₂g/e_g。</p><div class="actions"><button id="candidate">载入投影顺序候选</button><button id="restore">恢复运行时标签</button></div><div id="mapping" class="scroll"></div><label style="margin:12px 0"><input id="confirmed" type="checkbox">已核对实际 Wannier 基底、矩阵顺序与投影方向</label><button id="save-mapping">确认并保存标签</button><p id="mapping-status" role="status" class="note"></p><details><summary>本次基底与冻结投影证据</summary><h3>assigned_basis.txt</h3><pre id="basis"></pre><h3>projections</h3><pre id="projections"></pre></details></details><details><summary>数值与物理验证状态</summary><div id="validation"></div></details><script>/* BUNDLE */</script></body></html>
