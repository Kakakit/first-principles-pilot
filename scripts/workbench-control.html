<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>First Principles · 工作台控制</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#213a34;background:#edf3ef;color-scheme:light}*{box-sizing:border-box}body{margin:0;padding:36px 20px}main{max-width:820px;margin:auto}.brand{font-size:13px;letter-spacing:2px;color:#637970}h1{font-size:32px;margin:14px 0 10px}p{line-height:1.7;color:#526b60}section{background:#fff;border:1px solid #d9e5dd;border-radius:20px;padding:28px;margin-top:24px;box-shadow:0 8px 30px #1b3c2710}.status{display:flex;align-items:center;gap:12px;font-size:25px;font-weight:700}.dot{width:12px;height:12px;border-radius:50%;background:#93a399}.running .dot{background:#1c875e}.starting .dot,.stopping .dot{background:#be842a}.error .dot{background:#ba4b3a}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}button,a.button{font:inherit;padding:12px 18px;border:1px solid #b8cdc0;border-radius:10px;background:white;color:#254c3a;text-decoration:none;cursor:pointer;font-weight:600}.primary{background:#286247!important;color:#fff!important;border-color:#286247!important}button:disabled{opacity:.45;cursor:wait}a[aria-disabled=true]{pointer-events:none;opacity:.45}.danger{color:#ab3e2f!important}.notice{font-size:14px;margin:0}.message{padding:12px 16px;border-radius:10px;background:#fff4e7;color:#895718;white-space:pre-wrap;overflow-wrap:anywhere}.details{font-size:14px;margin-top:18px}summary{cursor:pointer;color:#426753;font-weight:600}dl{display:grid;grid-template-columns:100px 1fr;gap:12px;font-size:14px}dt{color:#73867c}dd{margin:0;overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;background:#f5f8f5;padding:16px;max-height:330px;overflow:auto}.footer{display:flex;justify-content:space-between;align-items:center;gap:16px;font-size:13px;margin-top:20px}.footer button{padding:8px 12px;font-size:13px}dialog{max-width:440px;border:1px solid #ceded1;border-radius:18px;padding:26px;margin:auto}dialog::backdrop{background:#18352f66}dialog h2{margin-top:0;font-size:22px}.dialog-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}@media(max-width:560px){body{padding:22px 12px}h1{font-size:27px}section{padding:22px 18px}.actions>*{flex:1;text-align:center}.footer{align-items:flex-start}dl{grid-template-columns:75px 1fr}}
</style></head><body><main>
<div class="brand">FIRST PRINCIPLES PILOT</div><h1>工作台控制</h1><p>打开计算工作台，或管理这台电脑上的服务。</p>
<section><div id="status" class="status"><span class="dot"></span><span id="phase" role="status">正在连接</span></div><p id="description">正在读取本机服务状态。</p><div id="message" class="message" role="alert" hidden></div>
<div class="actions"><a id="open" class="button primary" target="_blank" rel="noopener" aria-disabled="true">打开工作台</a><button id="start">启动</button><button id="restart">重启</button><button id="stop">停止</button></div>
<p class="notice">关闭网页不会停止服务。停止后，远端作业继续运行，本机监控与计算链推进暂停。重启前请确认项目已保存。</p>
<details class="details"><summary>启动日志与本机信息</summary><dl><dt>数据目录</dt><dd id="workspace">—</dd><dt>Python</dt><dd id="python">—</dd><dt>启动时间</dt><dd id="started">—</dd><dt>本机进程</dt><dd id="processes">—</dd></dl><button id="logs">刷新日志</button><pre id="log">展开后可读取启动日志。</pre></details></section>
<div class="footer"><span>只管理本目录启动的服务。</span><button class="danger" id="quit">退出控制中心</button></div>
</main><dialog id="confirm"><h2 id="confirm-title"></h2><p id="confirm-message"></p><div class="dialog-actions"><button id="cancel" autofocus>取消</button><button class="primary" id="confirm-action">确认</button></div></dialog>
<script>
const token='__CONTROL_TOKEN__',labels={stopped:'已停止',starting:'正在启动',running:'工作台运行中',stopping:'正在停止',error:'启动或运行遇到问题'};
const descriptions={stopped:'点击启动即可继续使用原工作区。',starting:'正在检查环境并启动网页、API 和监控。',running:'服务已就绪，可以打开工作台。',stopping:'正在等待本机进程安全退出，研究记录保留。',error:'查看下方原因，修正后可重新启动。'};
let pending=false,quitting=false,current=null,nextAction=null,actionError='';
const el=id=>document.getElementById(id);
function message(text){el('message').hidden=!text;el('message').textContent=text||'';}
async function refresh(){if(quitting)return;try{const response=await fetch('/status',{cache:'no-store'});if(!response.ok)throw Error('状态不可读');current=await response.json();el('phase').textContent=labels[current.phase]||current.phase;el('status').className='status '+current.phase;el('description').textContent=descriptions[current.phase]||'';el('open').href=current.url;el('open').setAttribute('aria-disabled',String(current.phase!=='running'));el('workspace').textContent=current.workspace;el('python').textContent=current.python;el('started').textContent=current.startedAt?new Date(current.startedAt).toLocaleString():'—';el('processes').textContent=current.processes.map(p=>p.name+' · '+p.pid).join('，')||'未启动';for(const action of ['start','restart','stop','quit'])el(action).disabled=pending||current.busy||(action==='start'&&current.phase==='running')||(['restart','stop'].includes(action)&&current.phase!=='running');message(current.error||actionError);}catch{el('phase').textContent='控制中心连接中断';el('description').textContent='重新双击“打开工作台.command”可恢复控制页。';for(const action of ['start','restart','stop','quit'])el(action).disabled=true;el('open').setAttribute('aria-disabled','true');}}
async function run(action){pending=true;actionError='';message('');await refresh();try{const response=await fetch('/'+action,{method:'POST',headers:{'Content-Type':'application/json','X-FPilot-Control':token},body:'{}'});const value=await response.json();if(!response.ok)throw Error(value.error||'操作未完成');if(action==='quit'){quitting=true;el('phase').textContent='正在退出控制中心';el('description').textContent='等待本机进程退出后即可关闭此页，下次双击启动入口重新打开。';}}catch(error){actionError=error.message;message(actionError);}finally{pending=false;await refresh();}}
for(const action of ['start','restart','stop','quit'])el(action).onclick=()=>{if(action==='start'){run(action);return;}nextAction=action;el('confirm-title').textContent=action==='restart'?'重启本机工作台':action==='stop'?'停止本机工作台':'退出控制中心';el('confirm-message').textContent='请确认项目已保存。此操作会停止本机网页、API 和监控；服务器上排队或运行的作业继续保留。'+(action==='restart'?'完成后会重新启动。':action==='quit'?'下次使用时双击启动入口。':'控制页保持打开，可以随时再启动。');el('confirm-action').textContent=action==='restart'?'确认重启':action==='stop'?'确认停止':'确认退出';el('confirm').showModal();};
el('cancel').onclick=()=>el('confirm').close();el('confirm-action').onclick=()=>{el('confirm').close();run(nextAction);};
el('logs').onclick=async()=>{try{const response=await fetch('/logs',{cache:'no-store'});const value=await response.json();el('log').textContent=value.text||'尚无启动日志。';}catch{el('log').textContent='日志暂时不可读。';}};
refresh();setInterval(refresh,2000);
</script></body></html>
