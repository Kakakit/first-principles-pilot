name: Workspace paths and command import checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/workspace-command-check.yml'
      - 'backend/job_templates.py'
      - 'tests/test_workspace_commands.py'
permissions:
  contents: read
jobs:
  windows-import:
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      FPILOT_NOTIFICATIONS: '0'
      PYTHONUTF8: '0'
      PYTHONIOENCODING: 'utf-8'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: 'python -m pip install --only-binary=:all: -r packaging/requirements-runtime.txt'
      - name: Native Windows imports, defaults and file replacement
        env:
          FPILOT_WORKSPACE: '${{ runner.temp }}/fpilot-onboarding-tests'
        run: python -m unittest discover -s tests -p test_workspace_commands.py -v

